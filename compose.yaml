# Production stack for veilrwa.xyz: Next.js app + risk agent behind Caddy (automatic HTTPS).
services:
  web:
    build: { context: ., dockerfile: web/Dockerfile }
    restart: unless-stopped
    volumes:
      - ./.env:/app/.env:ro
    expose: ["3000"]

  agent:
    build: { context: ., dockerfile: agent/Dockerfile }
    restart: unless-stopped
    volumes:
      - ./.env:/app/.env:ro
      - agent_data:/app/agent/data
    expose: ["8787"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [web, agent]
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  agent_data:
  caddy_data:
  caddy_config:
